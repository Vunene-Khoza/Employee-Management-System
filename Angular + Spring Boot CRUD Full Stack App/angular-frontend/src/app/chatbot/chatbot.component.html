<!-- Chat Button -->
<button class="chat-toggle-btn shadow" (click)="toggleChat()">
    <i class="bi" [ngClass]="{'bi-robot': !isOpen, 'bi-x-lg': isOpen}"></i>
</button>

<!-- Chat Window -->
<div class="chat-window shadow-lg" *ngIf="isOpen">
    <!-- Header -->
    <div class="chat-header d-flex justify-content-between align-items-center">
        <div>
            <i class="bi bi-robot me-2"></i> CHATBOT
        </div>
        <button class="btn btn-sm text-white p-0" (click)="toggleChat()">
            <i class="bi bi-x-lg"></i>
        </button>
    </div>

    <!-- Messages Body -->
    <div class="chat-body" #chatBody>
        <div *ngFor="let msg of messages" class="message-wrapper"
            [ngClass]="{'user-wrapper': msg.sender === 'user', 'bot-wrapper': msg.sender === 'bot'}">
            <div class="message-bubble"
                [ngClass]="{'user-bubble': msg.sender === 'user', 'bot-bubble': msg.sender === 'bot'}">
                <span *ngFor="let seg of msg.segments">
                    <span *ngIf="!seg.isLink">{{ seg.text }}</span>
                    <a *ngIf="seg.isLink" class="chat-inline-link" (click)="onActionClick(seg.route!)">{{ seg.text }}</a>
                </span>
                <div class="timestamp">{{ msg.timestamp | date:'shortTime' }}</div>
            </div>
        </div>

        <!-- Loading Indicator -->
        <div class="message-wrapper bot-wrapper" *ngIf="isLoading">
            <div class="message-bubble bot-bubble typing-indicator">
                <span></span><span></span><span></span>
            </div>
        </div>
    </div>

    <!-- Input Footer -->
    <div class="chat-footer">
        <div class="input-group">
            <input type="text" class="form-control" placeholder="Ask me anything..." [(ngModel)]="newMessage"
                (keyup)="handleKeyPress($event)" [disabled]="isLoading">
            <button class="btn btn-primary" (click)="sendMessage()" [disabled]="isLoading || !newMessage.trim()">
                <i class="bi bi-send-fill"></i>
            </button>
        </div>
    </div>
</div>
