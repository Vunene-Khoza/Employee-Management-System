<h2 class="page-title">Update User</h2>

<div class="col-md-5">
  <div class="card shadow border-0 p-4">

    @if (errorMessage) {
      <div class="alert alert-danger">{{ errorMessage }}</div>
    }

    <div class="mb-3">
      <label style="color: var(--univen-blue); font-weight: 500;">Email</label>
      <input
        type="email"
        class="form-control"
        [(ngModel)]="email"
        (blur)="validateEmail()"
        [class.is-invalid]="emailError"
      />
      @if (emailError) {
        <div class="invalid-feedback">{{ emailError }}</div>
      }
    </div>

    <div class="mb-3">
      <label style="color: var(--univen-blue); font-weight: 500;">Password (leave blank to keep current)</label>
      <input
        type="password"
        class="form-control"
        [(ngModel)]="password"
        placeholder="********"
      />
    </div>

    <div class="mb-3">
      <label style="color: var(--univen-blue); font-weight: 500;">Role</label>
      <select class="form-control" [(ngModel)]="role">
        <option value="ADMIN">Admin</option>
        <option value="SUPERVISOR">Supervisor</option>
        <option value="EMPLOYEE">Employee</option>
      </select>
    </div>

    <div class="mb-3">
      <label style="color: var(--univen-blue); font-weight: 500;">Department</label>
      <select class="form-control" [(ngModel)]="departmentId">
        <option value="0">-- Not Assigned --</option>
        <option *ngFor="let dept of departmentss" [value]="dept.id">
          {{ dept.name }}
        </option>
      </select>
    </div>

    <div class="d-flex gap-2">
      <button
        class="btn btn-univen-blue"
        (click)="onSubmit()"
        [disabled]="isLoading">
        {{ isLoading ? 'Updating...' : 'Update User' }}
      </button>
      <button class="btn btn-secondary" (click)="goBack()">Cancel</button>
    </div>

  </div>
</div>
