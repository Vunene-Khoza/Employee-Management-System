<div class="container mt-4">
  <div class="card shadow border-0 p-4" style="background: rgba(255,255,255,0.95); border-radius: 12px;">
    <h3 class="text-center mb-4" style="color: #082E67;">Update Employee</h3>

    <!-- Loading & Error States -->
    <div *ngIf="!isLoaded" class="alert alert-info">Loading employee details...</div>
    <div *ngIf="isLoaded && loadError" class="alert alert-warning">{{ loadError }}</div>

    <ng-container *ngIf="isLoaded && !loadError">
      <form (ngSubmit)="onSubmit(employeeForm)" #employeeForm="ngForm">
        <div class="row">
          <!-- Left Column: Profile Picture Preview -->
          <div class="col-md-4 text-center border-end">
            <label class="fw-bold mb-2" style="color: #082E67;">Profile Picture</label>
            <div class="mb-3">
              <img
                [src]="employee.profilePicture || 'assets/placeholder.png'"
                alt="Preview"
                class="img-thumbnail shadow-sm"
                style="width: 200px; height: 200px; object-fit: cover; border-radius: 50%; border: 4px solid #082E67;"
              />
            </div>
            <div class="mb-3">
              <input
                type="file"
                class="form-control form-control-sm"
                (change)="onFileSelected($event)"
                accept="image/*"
              />
              <small class="text-danger" *ngIf="fileError">{{ fileError }}</small>
              <p class="text-muted small mt-1">Max size: 5MB</p>
            </div>
          </div>

          <!-- Right Column: Employee Details -->
          <div class="col-md-8">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="firstName" class="form-label" style="color: #082E67;">First Name</label>
                <input
                  type="text"
                  id="firstName"
                  class="form-control"
                  required
                  [(ngModel)]="employee.firstName"
                  name="firstName"
                />
              </div>
              <div class="col-md-6 mb-3">
                <label for="lastName" class="form-label" style="color: #082E67;">Last Name</label>
                <input
                  type="text"
                  id="lastName"
                  class="form-control"
                  required
                  [(ngModel)]="employee.lastName"
                  name="lastName"
                />
              </div>
            </div>

            <div class="mb-3">
              <label for="emailId" class="form-label" style="color: #082E67;">Email ID</label>
              <input
                type="text"
                id="emailId"
                class="form-control"
                required
                placeholder="user@gmail.com"
                [(ngModel)]="employee.emailId"
                (ngModelChange)="onEmailInput($event)"
                name="emailId"
              />
              <small class="text-danger" *ngIf="emailError">{{ emailError }}</small>
            </div>

            <div class="mb-3">
              <label for="phoneNumber" class="form-label" style="color: #082E67;">Phone Number</label>
              <input
                type="text"
                id="phoneNumber"
                class="form-control"
                required
                placeholder="0812345678"
                [(ngModel)]="employee.phoneNumber"
                (ngModelChange)="onPhoneInput($event)"
                name="phoneNumber"
              />
              <small class="text-danger" *ngIf="phoneError">{{ phoneError }}</small>
            </div>

            <div class="mb-3">
              <label for="address" class="form-label" style="color: #082E67;">Address</label>
              <textarea
                id="address"
                class="form-control"
                required
                rows="2"
                [(ngModel)]="employee.address"
                name="address"
              ></textarea>
            </div>

            <div class="mb-4">
              <label for="dateOfBirth" class="form-label" style="color: #082E67;">Date of Birth</label>
              <input
                type="date"
                id="dateOfBirth"
                class="form-control"
                required
                [(ngModel)]="employee.dateOfBirth"
                (ngModelChange)="onDobInput($event)"
                name="dateOfBirth"
              />
              <small class="text-danger" *ngIf="dobError">{{ dobError }}</small>
            </div>

            <button
              type="submit"
              class="btn w-100 text-white fw-bold shadow-sm"
              style="background-color: #082E67; border: none; height: 45px;"
              [disabled]="isLoading || employeeForm.invalid || !isEmailValid() || !isPhoneValid() || !isDobValid()"
            >
              {{ isLoading ? 'Updating...' : 'Update Employee' }}
            </button>
          </div>
        </div>
      </form>
    </ng-container>
  </div>
</div>
