@if (isLoggedIn()) {
<nav class="navbar navbar-expand-lg navbar-univen">
  <div class="container">
    <span class="navbar-brand-text me-4">
      Uni<span>Ven</span> EMS
    </span>

    <ul class="navbar-nav me-auto">
      <li class="nav-item">
        <a class="nav-link" [routerLink]="['/employees']" routerLinkActive="active">
          Employee List
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" [routerLink]="['/create-employee']" routerLinkActive="active">
          Add Employee
        </a>
      </li>
    </ul>

    @if (isLoggedIn()) {
    <ul class="navbar-nav ms-auto align-items-center">
      <li class="nav-item me-3">
        <span class="navbar-text">{{ userEmail() }} ({{ userRole() }})</span>
      </li>
      <li class="nav-item">
        <button class="btn btn-sm text-white fw-bold" style="background-color: var(--univen-red); border: none;"
          (click)="logout()">
          <i class="bi bi-box-arrow-right"></i>
        </button>
      </li>
    </ul>
    }

  </div>
</nav>
}

<div [class.main-app-content]="isLoggedIn()" style="padding-bottom: 2rem;">
  <div class="container mt-4">
    <router-outlet></router-outlet>
  </div>
</div>

}
