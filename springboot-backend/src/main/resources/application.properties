# MySQL connection settings
spring.datasource.url=jdbc:mysql://localhost:3306/employee_management_system?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:YOUR_DATABASE_PASSWORD_HERE}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Optional but very common with JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# DevTools realtime auto-restart + livereload
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=true
spring.devtools.restart.additional-paths=src/main/java,src/main/resources
spring.devtools.restart.poll-interval=2s
spring.devtools.restart.quiet-period=1s
server.port=8080

# Spring AI Configuration (Connecting to Google Gemini via OpenAI compatibility layer)
spring.ai.openai.api-key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY_HERE}
spring.ai.openai.base-url=https://generativelanguage.googleapis.com
spring.ai.openai.chat.completions.path=/v1beta/openai/chat/completions
spring.ai.openai.chat.options.model=gemini-2.5-flash
